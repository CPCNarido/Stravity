<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Business Dashboard - Stravity</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800;900&family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --brand-1:#E1BEE7;
      --brand-2:#F8BBD9;
      --accent:#e91e63;
      --muted:#666;
    }
    html,body{height:100%;}
    body{font-family:'DM Sans', 'Nunito', system-ui, Arial, sans-serif; background: linear-gradient(135deg, #FDC3C3 0%, #F8BBD9 25%, #E1BEE7 50%, #F3E5F5 75%, #FDC3C3 100%); margin:0; color:#222; -webkit-font-smoothing:antialiased}
    header.site-header{background:rgba(255,255,255,0.9);backdrop-filter:blur(6px);padding:14px 24px;box-shadow:0 2px 20px rgba(0,0,0,0.06);position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(225,190,231,0.2)}
    .site-header .header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
    .site-logo{font-family:'DM Sans', sans-serif;font-weight:900;color:#2D1B69;text-decoration:none;font-size:1.6rem}
    .site-actions{display:flex;align-items:center;gap:10px}
    .container{max-width:980px;margin:34px auto;padding:24px;background:linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.9));border-radius:16px;box-shadow:0 10px 30px rgba(16,24,40,0.06);border:1px solid rgba(225,190,231,0.12)}
    h1{margin:0 0 8px;font-size:1.6rem;color:#2D1B69}
    h3{color:var(--accent);margin-top:0}
    .row{display:flex;gap:20px;flex-wrap:wrap}
    .col{flex:1;min-width:280px}
    .form-group{margin-bottom:12px}
    label{display:block;margin-bottom:6px;font-weight:700;color:#333}
    input,select,textarea{width:100%;padding:12px;border:1px solid #ece7f1;border-radius:12px;background:white;font-size:0.95rem}
    button{padding:10px 14px;border-radius:12px;border:none;cursor:pointer;font-weight:700}
    .btn-primary{background:linear-gradient(135deg,var(--brand-1),var(--brand-2));color:var(--accent);box-shadow:0 8px 18px rgba(225,190,231,0.18)}
    .btn-ghost{background:#fff;border:1px solid #f0f0f5;color:#333}
    .small{font-size:0.9rem;color:var(--muted)}
    .orders{margin-top:18px}
    .order{padding:12px;border-radius:10px;border:1px solid #f0eef6;background:linear-gradient(180deg,#fff,#fff);margin-bottom:12px}
    .order h4{margin:0 0 6px}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .link{color:#2D1B69;text-decoration:underline;cursor:pointer}
    @media(max-width:720px){.row{flex-direction:column}}
  </style>
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="header-inner">
        <a class="site-logo" href="index.html">Strativy</a>
        <div class="site-actions"><button onclick="goHome()" class="btn-ghost">Back to site</button></div>
      </div>
    </header>

    <div class="row">
      <div class="col" style="max-width:420px;">
        <h3 style="margin-top:0">Register Business</h3>
        <div class="form-group"><label>Business Name</label><input id="bizName" placeholder="My Pizza Place"></div>
        <div class="form-group"><label>Owner Email</label><input id="bizEmail" type="email" placeholder="owner@example.com"></div>
        <div class="form-group"><label>Password</label><input id="bizPassword" type="password"></div>
        <div class="form-group"><label>Confirm Password</label><input id="bizConfirm" type="password"></div>
        <div class="form-group"><label>Address</label><input id="bizAddress" placeholder="123 Main St"></div>
        <div style="display:flex;gap:10px">
          <button class="btn-primary" onclick="registerBusiness()">Create Business</button>
          <button class="btn-ghost" onclick="clearBizForm()">Clear</button>
        </div>
        <p class="small" style="margin-top:12px">Already have a business account? <span class="link" onclick="showBizLogin()">Sign in</span></p>

        <hr style="margin:18px 0">

        <div id="bizLoginBox" style="display:none">
          <h3>Business Login</h3>
          <div class="form-group"><label>Email</label><input id="bizLoginEmail"></div>
          <div class="form-group"><label>Password</label><input id="bizLoginPassword" type="password"></div>
          <div style="display:flex;gap:10px"><button class="btn-primary" onclick="loginBusiness()">Login</button><button class="btn-ghost" onclick="hideBizLogin()">Cancel</button></div>
        </div>
      </div>

      <div class="col">
        <div id="dashboardArea">
          <div id="bizWelcome" style="display:none">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <h2 id="bizTitle">Business Name</h2>
                <div class="small" id="bizOwner">Owner: owner@example.com</div>
              </div>
              <div>
                <button onclick="logoutBusiness()" class="btn-ghost">Logout</button>
              </div>
            </div>

            <div style="margin-top:14px">
              <strong>Orders received:</strong> <span id="bizOrdersCount">0</span>
            </div>

            <div class="orders" id="bizOrdersList">
              <div class="small">No orders yet.</div>
            </div>
          </div>

          <div id="bizNotSigned" style="display:block">
            <h3>Why register?</h3>
            <p class="small">As a registered business you can view orders placed for your business, contact customers, and manage your listing.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  // Business accounts stored as 'stravity_businesses' in localStorage
  let bizAccounts = [];
  let currentBiz = null;
  let orders = [];

  function loadBizAccounts(){
    try{ const raw = localStorage.getItem('stravity_businesses'); bizAccounts = raw ? JSON.parse(raw) : []; }catch(e){ bizAccounts = []; }
  }
  function saveBizAccounts(){ try{ localStorage.setItem('stravity_businesses', JSON.stringify(bizAccounts)); }catch(e){} }

  function loadOrders(){ try{ const raw = localStorage.getItem('stravity_orders'); orders = raw ? JSON.parse(raw) : []; }catch(e){ orders = []; } }

  function goHome(){ window.location.href = 'index.html'; }

  function clearBizForm(){ document.getElementById('bizName').value=''; document.getElementById('bizEmail').value=''; document.getElementById('bizPassword').value=''; document.getElementById('bizConfirm').value=''; document.getElementById('bizAddress').value=''; }

  function showBizLogin(){ document.getElementById('bizLoginBox').style.display='block'; }
  function hideBizLogin(){ document.getElementById('bizLoginBox').style.display='none'; }

  function registerBusiness(){
    const name = (document.getElementById('bizName').value||'').trim();
    const email = (document.getElementById('bizEmail').value||'').trim();
    const pw = (document.getElementById('bizPassword').value||'');
    const confirm = (document.getElementById('bizConfirm').value||'');
    const address = (document.getElementById('bizAddress').value||'').trim();

    if(!name||!email||!pw||!confirm){ alert('Fill required fields'); return; }
    if(pw!==confirm){ alert('Passwords do not match'); return; }

    loadBizAccounts();
    if(bizAccounts.find(b=>((b.email||b.ownerEmail||'').toLowerCase()===email.toLowerCase()))){ alert('Business account already exists for that email'); return; }

    const biz = { id: Date.now()+Math.floor(Math.random()*1000), businessName:name, ownerEmail:email, password:pw, address:address };
    bizAccounts.push(biz); saveBizAccounts();

    // auto-login
    currentBiz = { id:biz.id, businessName:biz.businessName, ownerEmail:biz.ownerEmail };
    localStorage.setItem('stravity_current_business', JSON.stringify(currentBiz));
    renderBizDashboard();
    alert('Business account created and signed-in');
  }

  function loginBusiness(){
    const email = (document.getElementById('bizLoginEmail').value||'').trim();
    const pw = (document.getElementById('bizLoginPassword').value||'');
    loadBizAccounts();
    const b = bizAccounts.find(x=>((x.email||x.ownerEmail||'').toLowerCase()===email.toLowerCase()) && x.password===pw);
    if(!b){ alert('Invalid credentials'); return; }
    currentBiz = { id:b.id, businessName:b.businessName, ownerEmail:b.ownerEmail };
    localStorage.setItem('stravity_current_business', JSON.stringify(currentBiz));
    renderBizDashboard();
    hideBizLogin();
  }

  function logoutBusiness(){ currentBiz=null; localStorage.removeItem('stravity_current_business'); renderBizDashboard(); }

  function renderBizDashboard(){
    loadBizAccounts(); loadOrders();
    const stored = localStorage.getItem('stravity_current_business');
    currentBiz = stored ? JSON.parse(stored) : currentBiz;

    const welcome = document.getElementById('bizWelcome');
    const notSigned = document.getElementById('bizNotSigned');
    if(currentBiz){
      welcome.style.display='block'; notSigned.style.display='none';
      document.getElementById('bizTitle').textContent = currentBiz.businessName;
      document.getElementById('bizOwner').textContent = 'Owner: ' + currentBiz.ownerEmail;

      // collect orders for this business
      const bizOrders = orders.filter(o => o.items.some(it => it.businessName === currentBiz.businessName));
      document.getElementById('bizOrdersCount').textContent = bizOrders.length;
      const list = document.getElementById('bizOrdersList');
      if(bizOrders.length===0){ list.innerHTML = '<div class="small">No orders yet.</div>'; }
      else{ list.innerHTML = bizOrders.map(o=>`<div class="order"><h4>Order #${o.id} — $${o.total.toFixed(2)}</h4><div class="small">${new Date(o.date).toLocaleString()} • ${o.username}</div><div style="margin-top:8px">${o.items.filter(it=>it.businessName===currentBiz.businessName).map(it=>`<div>${it.productName} × ${it.quantity}</div>`).join('')}</div></div>`).join(''); }
    } else {
      welcome.style.display='none'; notSigned.style.display='block';
    }
  }

  // Init
  function seedDummyData(){
    // Seed business accounts if none
    loadBizAccounts();
    if(!bizAccounts || bizAccounts.length === 0){
      bizAccounts = [
        { id: 1001, businessName: 'Mario\'s Pizza', ownerEmail: 'mario@pizza.test', password: 'pizza123', address: '12 Pizza St' },
        { id: 1002, businessName: 'Sunny Cafe', ownerEmail: 'owner@sunny.test', password: 'coffee123', address: '88 Bean Ave' }
      ];
      saveBizAccounts();
    }

    // Seed site user accounts (including admin) if none
    try{
      const raw = localStorage.getItem('stravity_accounts');
      let users = raw ? JSON.parse(raw) : [];
      if(!users || users.length === 0){
        users = [
          { id: 9001, username: 'admin', email: 'admin@stravity.test', password: 'admin123', address: '', preferences: [], isAdmin: true },
          { id: 9002, username: 'jane', email: 'jane@example.com', password: 'jane123', address: '45 North Rd', preferences: ['food'] }
        ];
        localStorage.setItem('stravity_accounts', JSON.stringify(users));
      }
    }catch(e){}

    // Seed orders if none (connect to businessName)
    loadOrders();
    if(!orders || orders.length === 0){
      orders = [
        { id: 7001, userId: 9002, username: 'jane', items: [{ productName: 'Margherita', businessName: "Mario's Pizza", price: 9.5, quantity: 1 }], total: 9.5, date: new Date().toISOString(), status: 'new' },
        { id: 7002, userId: 9002, username: 'jane', items: [{ productName: 'Cappuccino', businessName: 'Sunny Cafe', price: 3.5, quantity: 2 }], total: 7.0, date: new Date().toISOString(), status: 'new' }
      ];
      try{ localStorage.setItem('stravity_orders', JSON.stringify(orders)); }catch(e){}
    }
  }

  (function(){ seedDummyData(); loadBizAccounts(); loadOrders(); try{ const b=localStorage.getItem('stravity_current_business'); if(b) currentBiz=JSON.parse(b);}catch(e){} renderBizDashboard(); })();
</script>
</body>
</html>
